name: treevook

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-backend: &backend
  build:
    context: ../backend
  image: treevook-backend:${IMAGE_TAG:-latest}
  restart: unless-stopped
  init: true
  logging: *logging
  env_file: .env
  environment:
    NODE_ENV: production
    DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-treevook}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-treevook}}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    MEDIA_DIR: /app/storage/media
  volumes:
    - media:/app/storage/media
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    logging: *logging
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-treevook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-treevook}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    <<: *backend
    command: ["node", "dist/main.js"]

  worker:
    <<: *backend
    command: ["node", "dist/worker.js"]
    healthcheck:
      disable: true

  web:
    profiles: ["web"]
    build:
      context: ../web
      args:
        BACKEND_URL: http://api:4000
        ROOT_URL: ${ROOT_URL:-}
    image: treevook-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    init: true
    environment:
      ROOT_URL: ${ROOT_URL:-}
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  postgres:
  redis:
  media:
  caddy_data:
  caddy_config:
