name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy this commit after the checks pass
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend == 'true' || steps.filter.outputs.ci == 'true' || github.event_name == 'workflow_dispatch' }}
      web: ${{ steps.filter.outputs.web == 'true' || steps.filter.outputs.backend == 'true' || steps.filter.outputs.ci == 'true' || github.event_name == 'workflow_dispatch' }}
      plugin: ${{ steps.filter.outputs.plugin == 'true' || steps.filter.outputs.ci == 'true' }}
      deploy-config: ${{ steps.filter.outputs.deploy == 'true' || steps.filter.outputs.ci == 'true' }}
      deployable: ${{ steps.filter.outputs.backend == 'true' || steps.filter.outputs.web == 'true' || steps.filter.outputs.deploy == 'true' || inputs.deploy == true }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend: ["backend/**"]
            web: ["web/**"]
            plugin: ["plugin/**"]
            deploy: ["deploy/**"]
            ci: [".github/workflows/**"]

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: adpilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/adpilot_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      TOKEN_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      META_MOCK: "true"
      PLAY_MOCK: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  e2e:
    needs: [changes, web]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: adpilot_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/adpilot_e2e
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      TOKEN_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      META_MOCK: "true"
      PLAY_MOCK: "true"
      AI_MOCK: "true"
      AUTH_GOOGLE_MOCK: "true"
      META_ADS_LOGIN_CONFIG_ID: mock-ads-login-config
      APP_URL: http://localhost:3200
      OTP_TEST_NUMBERS: 9000000007:123456,9000000008:123456,9000000009:123456
      WEB_ORIGINS: http://localhost:3200
      BACKEND_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            web/package-lock.json
      - name: Start backend
        working-directory: backend
        run: |
          npm ci
          npm run db:migrate
          npm run build
          nohup node dist/main.js > api.log 2>&1 &
          nohup node dist/worker.js > worker.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:4000/health && break; sleep 1; done
      - name: Start web
        working-directory: web
        run: |
          npm ci
          npm run build
          cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/
          PORT=3200 nohup node .next/standalone/server.js > web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null localhost:3200/login && break; sleep 1; done
      - name: Playwright
        working-directory: web
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-artifacts
          path: |
            web/test-results
            backend/*.log
            web/web.log

  plugin:
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:render

  deploy-config:
    needs: changes
    if: needs.changes.outputs.deploy-config == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compose file
        working-directory: deploy
        run: |
          cp .env.production.example .env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/; s/^ACME_EMAIL=$/ACME_EMAIL=ci@example.com/' .env
          docker compose config -q
          COMPOSE_PROFILES=web docker compose config -q
      - name: Caddyfiles
        run: |
          for f in Caddyfile Caddyfile.api; do
            docker run --rm -e DOMAIN=example.com -e ACME_EMAIL=ci@example.com -v "$PWD/deploy/$f:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          done
      - name: Scripts
        run: bash -n deploy/update.sh deploy/backup.sh deploy/remote-deploy.sh

  deploy:
    needs: [changes, backend, web, e2e, deploy-config]
    if: >-
      !cancelled()
      && !contains(needs.*.result, 'failure')
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || inputs.deploy == true)
      && needs.changes.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: web/scripts
      - name: Deploy to the Oracle server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o ServerAliveInterval=30 "ubuntu@$HOST" "$GITHUB_SHA"
      - name: Smoke test
        run: |
          for url in https://api.treevook.com/health https://treevook.com/privacy https://playreview.treevook.com/ https://googlebusiness.treevook.com/login; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors "$url")
            echo "$url $code"
            [ "$code" -lt 400 ]
          done
      - name: Tell search engines about changes (IndexNow)
        if: needs.changes.outputs.web == 'true'
        continue-on-error: true
        run: node web/scripts/indexnow.mjs
