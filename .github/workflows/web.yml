name: web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "backend/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "backend/**", ".github/workflows/web.yml"]

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: adpilot_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/adpilot_e2e
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      TOKEN_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      META_MOCK: "true"
      PLAY_MOCK: "true"
      AI_MOCK: "true"
      AUTH_GOOGLE_MOCK: "true"
      APP_URL: http://localhost:3200
      OTP_TEST_NUMBERS: 9000000007:123456,9000000008:123456,9000000009:123456
      WEB_ORIGINS: http://localhost:3200
      BACKEND_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            web/package-lock.json
      - name: Start backend
        working-directory: backend
        run: |
          npm ci
          npm run db:migrate
          npm run build
          nohup node dist/main.js > api.log 2>&1 &
          nohup node dist/worker.js > worker.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:4000/health && break; sleep 1; done
      - name: Start web
        working-directory: web
        run: |
          npm ci
          npm run build
          nohup npx next start -p 3200 > web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null localhost:3200/login && break; sleep 1; done
      - name: Playwright
        working-directory: web
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-artifacts
          path: |
            web/test-results
            backend/*.log
            web/web.log
