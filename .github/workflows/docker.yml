name: docker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["backend/**", "web/**", "deploy/**", ".github/workflows/docker.yml"]
  pull_request:
    paths: ["backend/**", "web/**", "deploy/**", ".github/workflows/docker.yml"]

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Validate compose file
        working-directory: deploy
        run: |
          cp .env.production.example .env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/; s/^ACME_EMAIL=$/ACME_EMAIL=ci@example.com/' .env
          docker compose config -q
      - name: Validate Caddyfile
        run: docker run --rm -e DOMAIN=example.com -e ACME_EMAIL=ci@example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: treevook-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: false
          tags: treevook-web:ci
          build-args: |
            BACKEND_URL=http://api:4000
            ROOT_URL=https://treevook.com
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
